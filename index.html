<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rizwan Anver | Portfolio</title>
<meta name="description" content="Labs, scripts, slides and writing.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f5;--panel:#fff;--ink:#0f1b2d;--mute:#58657a;--line:#d5dce6;--acc:#0a7fa0;--acc-ink:#fff;
--script:#6d4fd6;--pt:#0a7fa0;--slides:#d2691e;--doc:#2f8a4f;
--head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--body:'Instrument Sans','Segoe UI',system-ui,sans-serif;--code:ui-monospace,Menlo,Consolas,monospace}
:root[data-theme=dark]{--bg:#0a1220;--panel:#111c2e;--ink:#e8eef7;--mute:#93a1b8;--line:#223149;--acc:#3dd0e6;--acc-ink:#06202a;
--script:#a38cff;--pt:#3dd0e6;--slides:#ff9d57;--doc:#5fd48a}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--body)}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
h1,h2,h3{font-family:var(--head);line-height:1.1;margin:0}

/* header + dropdowns */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:8px;height:60px}
.brand{font:800 1.15rem var(--head);text-decoration:none;margin-right:auto}
nav ul{list-style:none;margin:0;padding:0;display:flex;gap:2px}
nav li{position:relative}
nav a,nav button.dd{font:500 .95rem var(--body);color:var(--ink);background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;text-decoration:none;display:flex;align-items:center;gap:6px}
nav a:hover,nav button.dd:hover,nav li.open>button{background:var(--line)}
.dd::after{content:"";width:6px;height:6px;border:solid currentColor;border-width:0 2px 2px 0;transform:rotate(45deg) translateY(-2px)}
.menu{position:absolute;top:100%;left:0;min-width:210px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 12px 30px rgba(8,20,40,.18);display:none}
li.open>.menu{display:block}
.menu a{padding:9px 12px;white-space:nowrap}
.menu .sw{width:9px;height:9px;border-radius:2px}
.icon-btn{background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;width:38px;height:38px;cursor:pointer;font-size:1rem}
#burger{display:none}

/* hero */
.hero{padding:72px 0 48px;display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}
.hero h1{font-size:clamp(2.4rem,6vw,4.1rem);font-weight:800;letter-spacing:-.02em}
.hero p{color:var(--mute);font-size:1.12rem;max-width:46ch;margin:18px 0 26px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:600;text-decoration:none;cursor:pointer;font-family:var(--body);font-size:.95rem;color:var(--ink)}
.btn.main{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn:hover{filter:brightness(.95)}
.topo{width:100%;height:auto;color:var(--line)}
.topo .n{fill:var(--panel);stroke:var(--acc);stroke-width:2}
.topo path{stroke:currentColor;stroke-width:2;fill:none}
.pkt{fill:var(--acc);offset-path:path("M60 190 L150 90 L270 130 L350 50");animation:go 4s ease-in-out infinite}
@keyframes go{from{offset-distance:0%}to{offset-distance:100%}}

/* sections */
section{padding:44px 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sec-h h2{font-size:1.9rem}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 14px;border-radius:99px;font:500 .88rem var(--body);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#q{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 14px;border-radius:99px;font:.9rem var(--body);width:180px}

/* file rows */
.list{border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden}
.row{display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:center;padding:16px 18px;border-top:1px solid var(--line);border-left:4px solid var(--c)}
.row:first-child{border-top:0}
.row[data-type=script]{--c:var(--script)}.row[data-type=pt]{--c:var(--pt)}.row[data-type=slides]{--c:var(--slides)}.row[data-type=doc]{--c:var(--doc)}
.kind{font:600 .8rem var(--body);color:var(--c)}
.row h3{font-size:1.08rem;font-weight:700}
.row p{margin:3px 0 6px;color:var(--mute);font-size:.93rem}
.tag{display:inline-block;font:.78rem var(--code);color:var(--mute);border:1px solid var(--line);border-radius:5px;padding:0 6px;margin:0 4px 4px 0}
.acts{display:flex;gap:6px}
.acts .btn{padding:6px 12px;font-size:.85rem}
.empty{padding:30px;text-align:center;color:var(--mute)}

/* blog */
.post{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:12px;cursor:pointer;color:var(--ink);font-family:var(--body)}
.post:hover{border-color:var(--acc)}
.post time{font-size:.85rem;color:var(--mute)}
.post h3{font-size:1.25rem;margin:4px 0}
.post p{margin:0;color:var(--mute)}

.about{display:grid;grid-template-columns:1fr 1fr;gap:32px}
.about p{margin:0 0 14px;color:var(--mute)}
.skills{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
footer{border-top:1px solid var(--line);padding:26px 0;color:var(--mute);font-size:.9rem}

/* modal */
dialog{width:min(820px,94vw);max-height:88vh;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:0}
dialog::backdrop{background:rgba(5,12,24,.6)}
.m-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.m-head h3{margin-right:auto;font-size:1.1rem}
.m-body{padding:18px 22px;overflow:auto;max-height:calc(88vh - 62px)}
.m-body pre{margin:0;font:.85rem/1.5 var(--code);white-space:pre;overflow:auto}
.m-body iframe{width:100%;height:60vh;border:0;border-radius:8px}
.m-body p{max-width:70ch}

@media(max-width:780px){
.hero,.about{grid-template-columns:1fr}.hero{padding-top:40px}
#burger{display:block}
nav{display:none;position:absolute;top:60px;left:0;right:0;background:var(--panel);border-bottom:1px solid var(--line);padding:10px 20px}
nav.show{display:block}nav ul{flex-direction:column}
.menu{position:static;box-shadow:none;border:0;padding:0 0 0 14px}
.row{grid-template-columns:1fr}.acts{flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){.pkt{animation:none;offset-distance:60%}html{scroll-behavior:auto}}
</style>
</head>
<body>

<header>
  <div class="wrap bar">
    <a class="brand" href="#top" id="brand"></a>
    <nav id="nav" aria-label="Main">
      <ul>
        <li><button class="dd" aria-expanded="false" aria-haspopup="true">Projects</button>
          <div class="menu" id="workMenu"></div></li>
        <li><a href="#blog">Rants</a></li>
        <li><a href="#about">About</a></li>
        <li><button class="dd" aria-expanded="false" aria-haspopup="true">Links</button>
          <div class="menu" id="linkMenu"></div></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
    <button class="icon-btn" id="theme" aria-label="Toggle dark mode">◐</button>
    <button class="icon-btn" id="burger" aria-label="Menu">☰</button>
  </div>
</header>

<main id="top">
  <div class="wrap hero">
    <div>
      <h1 id="hName"></h1>
      <p id="hTag"></p>
      <div class="btns">
        <a class="btn main" href="#work">Browse my most recent work</a>
        <a class="btn" href="#blog">Read my rants</a>
      </div>
    </div>
    <svg class="topo" viewBox="0 0 420 240" aria-hidden="true">
      <path d="M60 190 L150 90 L270 130 L350 50 M150 90 L200 200 L270 130 M60 190 L200 200"/>
      <circle class="n" cx="60" cy="190" r="12"/><circle class="n" cx="150" cy="90" r="12"/>
      <circle class="n" cx="270" cy="130" r="12"/><circle class="n" cx="350" cy="50" r="12"/>
      <circle class="n" cx="200" cy="200" r="12"/>
      <circle class="pkt" r="6"/>
    </svg>
  </div>

  <section id="work"><div class="wrap">
    <div class="sec-h"><h2>Projects</h2>
      <div class="tools"><div id="chips" class="tools"></div><input id="q" type="search" placeholder="Search files" aria-label="Search files"></div>
    </div>
    <div class="list" id="list"></div>
  </div></section>

  <section id="blog"><div class="wrap">
    <div class="sec-h"><h2>Rants</h2></div>
    <div id="posts"></div>
  </div></section>

  <section id="about"><div class="wrap about">
    <div><h2 style="margin-bottom:16px">About</h2><div id="aboutText"></div></div>
    <div><h2 style="margin-bottom:16px">Skills</h2><div class="skills" id="skills"></div></div>
  </div></section>

  <section id="contact"><div class="wrap">
    <h2 style="margin-bottom:14px">Contact</h2>
    <p style="color:var(--mute);margin:0 0 16px">Wanna grab my attention or stalk?.</p>
    <div class="btns" id="contactBtns"></div>
  </div></section>
</main>

<footer><div class="wrap" id="foot"></div></footer>

<dialog id="dlg">
  <div class="m-head"><h3 id="mTitle"></h3><button class="btn" id="mCopy" hidden>Copy</button><button class="btn" id="mClose">Close</button></div>
  <div class="m-body" id="mBody"></div>
</dialog>

<script>
/* ============ EDIT THIS SECTION ============ */
const CONFIG = {
  name: "Rizwan",
  tagline: "Network and systems projects: labs, scripts, slide decks and write-ups, all in one place.",
  about: [
    "Hey, I'm Rizwan. This entire site is dedicated for showcasing whatever I'm up to. I'm on a quest to land in CyberSecurity"
    "Free feel to browse or shoot me a message if you're ever curious about anything!"
  ],
  skills: ["Networking","C++", "MySQL","Routing & Switching","VLANs","ACLS","Python","PowerShell","Windows", "Active Directory" "Linux","DevOps"],
  email: "rizwananver07@gmail.com",
  links: [
    { label: "GitHub",   url: "https://github.com/rizwan-cst" },
    { label: "LinkedIn", url: "https://linkedin.com/in/yourname" },
    { label: "Resume (PDF)", url: "files/docs/resume.pdf" }
  ]
};

/* type: script | pt | slides | doc   |   file = path inside your repo   |   date = YYYY-MM-DD */
const ITEMS = [
  { type:"pt",     title:"VLAN and inter-VLAN routing lab", desc:"Three VLANs, a router-on-a-stick and DHCP relay.", file:"files/packet-tracer/vlan-lab.pkt", tags:["vlan","routing"], date:"2026-09-02" },
  { type:"script", title:"Backup switch configs",           desc:"Pulls running configs over SSH and saves them with a timestamp.", file:"files/scripts/backup_configs.py", tags:["python","ssh"], date:"2026-08-14" },
  { type:"slides", title:"Intro to subnetting",             desc:"Slides from my class presentation.", file:"files/slides/subnetting.pptx", tags:["pptx","ipv4"], date:"2026-07-20" },
  { type:"doc",    title:"Network design report",           desc:"Design notes and IP plan for a small office.", file:"files/docs/network-design.pdf", tags:["pdf","design"], date:"2026-06-30" }
];

/* body is HTML. Add as many posts as you like, newest first. */
const POSTS = [
  { title:"Fostering Positive Communication", date:"2026-05-14",
    summary:"What does it mean to Foster Positive Communicaton",
    body:"<p>Replace this with your 
post. You can use any HTML here: paragraphs, lists, <code>code</code>, images (<code>&lt;img src='files/img/topology.png'&gt;</code>) and links to your files.</p>" }
];
/* ============ END EDIT SECTION ============ */

const TYPES = {
  script:{label:"Scripts", kind:"Script"},
  pt:{label:"Packet Tracer", kind:"Packet Tracer"},
  slides:{label:"Slides", kind:"Slides"},
  doc:{label:"Documents", kind:"Document"}
};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => new Date(d + "T00:00").toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});
let filter = "all";

/* basics */
document.title = CONFIG.name + " | Portfolio";
$("#brand").textContent = CONFIG.name;
$("#hName").textContent = CONFIG.name;
$("#hTag").textContent = CONFIG.tagline;
$("#aboutText").innerHTML = CONFIG.about.map(p => `<p>${esc(p)}</p>`).join("");
$("#skills").innerHTML = CONFIG.skills.map(s => `<span class="tag">${esc(s)}</span>`).join("");
$("#contactBtns").innerHTML = `<a class="btn main" href="mailto:${esc(CONFIG.email)}">Email me</a>` +
  CONFIG.links.map(l => `<a class="btn" href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
$("#foot").textContent = `© ${new Date().getFullYear()} ${CONFIG.name}. Built with plain HTML and hosted on GitHub Pages.`;
$("#linkMenu").innerHTML = CONFIG.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join("");
$("#workMenu").innerHTML = `<a href="#work" data-f="all">All work</a>` +
  Object.entries(TYPES).map(([k,v]) => `<a href="#work" data-f="${k}"><span class="sw" style="background:var(--${k})"></span>${v.label}</a>`).join("");

/* filter chips + list */
function chips(){
  $("#chips").innerHTML = [["all","All"],...Object.entries(TYPES).map(([k,v])=>[k,v.label])]
    .map(([k,l]) => `<button class="chip ${filter===k?"on":""}" data-f="${k}">${l}</button>`).join("");
}
function render(){
  const q = $("#q").value.trim().toLowerCase();
  const rows = ITEMS.filter(i => (filter==="all"||i.type===filter) &&
    (!q || (i.title+i.desc+i.tags.join(" ")).toLowerCase().includes(q)))
    .sort((a,b) => b.date.localeCompare(a.date));
  $("#list").innerHTML = rows.length ? rows.map(i => {
    const idx = ITEMS.indexOf(i);
    const view = i.type==="script" ? `<button class="btn" data-view="${idx}">View code</button>`
               : i.type==="slides" ? `<button class="btn" data-view="${idx}">Preview</button>` : "";
    return `<article class="row" data-type="${i.type}">
      <div><div class="kind">${TYPES[i.type].kind}</div><time style="font-size:.8rem;color:var(--mute)">${fmt(i.date)}</time></div>
      <div><h3>${esc(i.title)}</h3><p>${esc(i.desc)}</p>${i.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>
      <div class="acts">${view}<a class="btn" href="${esc(i.file)}" download>Download</a></div></article>`;
  }).join("") : `<div class="empty">No files match. Try another category or search.</div>`;
  chips();
}
function setFilter(f){ filter = f; render(); }

/* blog */
$("#posts").innerHTML = POSTS.map((p,i) => `<button class="post" data-post="${i}"><time>${fmt(p.date)}</time><h3>${esc(p.title)}</h3><p>${esc(p.summary)}</p></button>`).join("");

/* modal */
const dlg = $("#dlg");
function openModal(title, node, copyText){
  $("#mTitle").textContent = title;
  const b = $("#mBody"); b.replaceChildren(node);
  const c = $("#mCopy"); c.hidden = copyText == null; c.textContent = "Copy"; c._t = copyText;
  dlg.showModal();
}
async function viewItem(i){
  const it = ITEMS[i];
  if (it.type === "script"){
    const pre = document.createElement("pre"); pre.textContent = "Loading…";
    openModal(it.file.split("/").pop(), pre, null);
    try {
      const r = await fetch(it.file); if(!r.ok) throw 0;
      const t = await r.text(); pre.textContent = t;
      $("#mCopy").hidden = false; $("#mCopy")._t = t;
    } catch { pre.textContent = "Could not load this file. Check the path in ITEMS and that the file is in your repo."; }
  } else {
    const url = new URL(it.file, location.href).href;
    const f = document.createElement("iframe"); f.title = it.title;
    f.src = "https://view.officeapps.live.com/op/embed.aspx?src=" + encodeURIComponent(url);
    const w = document.createElement("div");
    const n = document.createElement("p"); n.style.cssText="color:var(--mute);font-size:.85rem";
    n.textContent = "The preview works once the site is live on GitHub Pages. Otherwise use Download.";
    w.append(f,n); openModal(it.title, w, null);
  }
}
function viewPost(i){
  const p = POSTS[i], d = document.createElement("div");
  d.innerHTML = `<time style="color:var(--mute)">${fmt(p.date)}</time>${p.body}`;
  openModal(p.title, d, null);
}
$("#mClose").onclick = () => dlg.close();
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
$("#mCopy").onclick = async e => { try { await navigator.clipboard.writeText(e.target._t); e.target.textContent = "Copied"; } catch { e.target.textContent = "Copy failed"; } };

/* events */
document.addEventListener("click", e => {
  const t = e.target;
  const f = t.closest("[data-f]"); if (f) setFilter(f.dataset.f);
  const v = t.closest("[data-view]"); if (v) viewItem(+v.dataset.view);
  const p = t.closest("[data-post]"); if (p) viewPost(+p.dataset.post);
  const dd = t.closest("button.dd");
  document.querySelectorAll("nav li.open").forEach(li => { if (!dd || li !== dd.parentElement) { li.classList.remove("open"); li.firstElementChild.setAttribute("aria-expanded","false"); } });
  if (dd){ const o = dd.parentElement.classList.toggle("open"); dd.setAttribute("aria-expanded", o); }
  else if (t.closest("nav a")) $("#nav").classList.remove("show");
});
document.addEventListener("keydown", e => { if (e.key==="Escape") document.querySelectorAll("nav li.open").forEach(li => li.classList.remove("open")); });
$("#q").addEventListener("input", render);
$("#burger").onclick = () => $("#nav").classList.toggle("show");

/* theme */
const root = document.documentElement;
let theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
try { theme = localStorage.getItem("theme") || theme; } catch {}
root.dataset.theme = theme;
$("#theme").onclick = () => {
  theme = root.dataset.theme === "dark" ? "light" : "dark"; root.dataset.theme = theme;
  try { localStorage.setItem("theme", theme); } catch {}
};

render();
</script>
</body>
</html>
